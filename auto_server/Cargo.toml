[package]
name = "auto_server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "auto_server"
path = "src/main.rs"

[dependencies]
actix-web = "4"
actix-files = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
percent-encoding = "2"
bytes = "1"
mime_guess = "2"
